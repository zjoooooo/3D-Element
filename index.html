<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>五行降世 · Wuxing Descends</title>

    <!--
      Favicon: 五行五色圆环纹, hand-written inline SVG data-URI (no build step,
      no extra file). Five arcs in 相生 order (金生水生木生火生土) around a dark
      disc so it reads at 16px. `#` in each hex colour is escaped to `%23` —
      unescaped it would truncate the data URI at a URL fragment.
    -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230a0e14'/><circle cx='32' cy='32' r='22' fill='none' stroke='%23d8b46a' stroke-width='10' stroke-dasharray='20 118.23' transform='rotate(0 32 32)'/><circle cx='32' cy='32' r='22' fill='none' stroke='%236fb8e8' stroke-width='10' stroke-dasharray='20 118.23' transform='rotate(72 32 32)'/><circle cx='32' cy='32' r='22' fill='none' stroke='%2374d7a8' stroke-width='10' stroke-dasharray='20 118.23' transform='rotate(144 32 32)'/><circle cx='32' cy='32' r='22' fill='none' stroke='%23e86f4f' stroke-width='10' stroke-dasharray='20 118.23' transform='rotate(216 32 32)'/><circle cx='32' cy='32' r='22' fill='none' stroke='%23b58f5e' stroke-width='10' stroke-dasharray='20 118.23' transform='rotate(288 32 32)'/></svg>" />

    <!-- Open Graph / Twitter card (spec §9.5 门面三件套) — outside the WebGL2
         gate below on purpose: a crawler never runs JS, so these have to sit
         as plain markup for og:image/description to show up when the link is
         shared, regardless of whether the visitor's browser ever clears the
         gate. og:image is repo-relative (`/og.png`) since there's no deployed
         domain yet to give it an absolute URL — swap in the full URL once one
         exists. -->
    <meta property="og:title" content="五行降世 · Wuxing Descends" />
    <meta property="og:description" content="十五分钟，五行相生相克，一人对抗潮汐" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./src/ui/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <!-- Boot / loading veil -->
    <div id="loader" class="loader">
      <div class="loader__inner">
        <div class="loader__sigil">
          <span class="sigil sigil--a"></span>
          <span class="sigil sigil--b"></span>
          <span class="sigil sigil--c"></span>
          <span class="sigil sigil--d"></span>
        </div>
        <h1 class="loader__title">Elemental Sandbox</h1>
        <div class="loader__bar"><i id="loader-fill"></i></div>
        <p class="loader__status" id="loader-status">Growing the crystals…</p>
      </div>
    </div>

    <!-- Heads-up display (populated by src/ui/HUD.js) -->
    <div id="hud" class="hud" aria-live="polite"></div>

    <!--
      WebGL2 gate: must run before src/main.js. Sets window.__gateOk, which
      main.js checks before touching the canvas — a dynamically-injected
      module tag looked cleaner (a gated browser would fetch nothing) but
      Vite's build only discovers a JS entry point from a *static*
      type="module" tag in this file; injecting one at runtime left `vite
      build` with zero JS output (verified). The static tag has to stay, so
      the flag main.js reads is the actual mechanism, not just a fallback.
    -->
    <script>
      (function () {
        var hasWebgl2 = !!window.WebGL2RenderingContext && !!document.createElement('canvas').getContext('webgl2');
        var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
        var smallScreen = Math.min(window.innerWidth, window.innerHeight) < 760;
        var mobile = coarse && smallScreen;
        window.__gateOk = hasWebgl2 && !mobile;
        if (window.__gateOk) {
          // Preload the heavy first-paint assets only for a visitor who
          // cleared the gate — static <link rel=preload> tags would have
          // fetched these for every visitor, including the WebGL2-less/
          // mobile ones this gate turns away (M5 T13 leftover).
          [
            ['fetch', './models/Standing%20Idle.fbx'],
            ['fetch', './models/Fast%20Run-2.fbx'],
            // `crossOrigin` to match TextureLoader, which requests anonymously.
            ['image', './models/diffuse2.jpg']
          ].forEach(function (asset) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = asset[0];
            link.href = asset[1];
            link.crossOrigin = 'anonymous';
            document.head.appendChild(link);
          });
          return;
        }

        var zh = mobile ? '请使用桌面浏览器' : '需要支持 WebGL2 的桌面浏览器';
        var en = mobile ? 'Please use a desktop browser.' : 'This game needs a desktop browser with WebGL2.';
        document.body.innerHTML =
          '<div class="fatal-overlay">' +
          '<p class="fatal-overlay__zh">' + zh + '</p>' +
          '<p class="fatal-overlay__en">' + en + '</p>' +
          '</div>';
      })();
    </script>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
